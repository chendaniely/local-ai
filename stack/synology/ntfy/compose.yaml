# ntfy on the Synology: the notification server for the Spark's alerts (Phase 2a). It deploys with any Compose
# helper: as a Portainer stack (from its web editor, or this repo as a Git-repository stack), or with
# `docker compose up -d`. The runbook is website/how-to/ntfy.md.
#
# It follows Marius Hosting's Synology ntfy guide
# (https://mariushosting.com/how-to-install-ntfy-on-your-synology-nas/): his container name, his folder with its
# cache subfolder, his server.yml in that folder, his healthcheck and his port. It keeps three things his guide
# doesn't have: a login for every reader and publisher, no path from the internet, and the image pinned by digest.
#
# This file is public and holds nothing private, so it is pasted as it is, with no variables. What is private (the
# NAS's address, the users' hashes, the topic names and the tokens) is in server.yml, which the runbook's §3 writes
# on the Spark and §4 uploads to the folder; server.example.yml, beside this file, shows its shape. The settings
# that aren't private are here, so the repo shows them. The image is pinned by its index digest, the one
# stack/versions.yaml records.
services:
  ntfy:
    image: docker.io/binwiederhier/ntfy:v2.28.0@sha256:6ef4b819f722fccdc036af611c4774cfdc2de821ab74fdd48bbf4c9d6f8973da
    container_name: ntfy
    # --config named outright: ntfy v2.28.0 then refuses to start if server.yml is missing, and never runs without
    # its users.
    command: serve --config /etc/ntfy/server.yml
    # Not Marius's on-failure:5: Docker doesn't restart an on-failure container when its daemon restarts, so a
    # NAS reboot or a DSM update would leave ntfy down, and the alerts would stop without a word.
    restart: unless-stopped
    environment:
      # Nobody reads or publishes without a login, even if server.yml lost its users: the auth database and the
      # deny-all default are set here, where ntfy takes them over any server.yml. The users, their access and
      # the tokens are server.yml's, set again each time ntfy starts (ntfy v2.28.0's auth-users, auth-access and
      # auth-tokens).
      NTFY_AUTH_FILE: /etc/ntfy/user.db
      NTFY_AUTH_DEFAULT_ACCESS: deny-all
      NTFY_CACHE_FILE: /var/cache/ntfy/cache.db
      NTFY_BEHIND_PROXY: "false"
      # Reached over the tailnet or the home LAN only: no upstream server, no Firebase, no web push, and no
      # attachments (no attachment-cache-dir). No TZ either: it would name a place in this public file, and the
      # image's arm64 build has no timezone data, so ntfy logs in UTC there whatever TZ says.
    # Marius's folders: server.yml and the auth database in the first, the message cache in its cache subfolder.
    volumes:
      - /volume1/docker/ntfy:/etc/ntfy
      - /volume1/docker/ntfy/cache:/var/cache/ntfy
    # Marius's healthcheck, which is also ntfy's own docs': the image is Alpine, so busybox's wget and grep are in
    # it, and /v1/health answers without a login under deny-all. Docker only reports the result; it restarts
    # nothing on its own.
    healthcheck:
      test: ["CMD-SHELL", "wget -q --tries=1 http://localhost:80/v1/health -O - | grep -Eo '\"healthy\"\\s*:\\s*true' || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 40s
    ports:
      - "6741:80"
