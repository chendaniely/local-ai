# Every pinned component. `spark apply` refuses to deploy a component with deployed: true and no pin.
# pin: sha256:<64 hex> — a release file's checksum, or a container image's digest.
# git:<40 hex> — the commit a source build was built from.
components:
  uv:
    version: 0.12.18
    where: [mac, spark]
    pin: null
    deployed: false
    docs: https://docs.astral.sh/uv/
    context7: /astral-sh/uv
    changelog: https://github.com/astral-sh/uv/releases
    advisories: https://github.com/astral-sh/uv/security/advisories
  quarto:
    version: 1.10.3
    where: [mac, ci]
    pin: null
    deployed: false
    docs: https://quarto.org/docs/
    context7: /quarto-dev/quarto-web
    changelog: https://github.com/quarto-dev/quarto-cli/releases
    advisories: null
  gitleaks:
    version: 8.30.1
    where: [mac, spark, ci]
    pin: null
    deployed: false
    docs: https://github.com/gitleaks/gitleaks
    context7: null
    changelog: https://github.com/gitleaks/gitleaks/releases
    advisories: https://github.com/gitleaks/gitleaks/security/advisories
  # Host packages apt moves, recorded so an upgrade has a "before" to compare against: Docker came
  # with DGX OS, from NVIDIA's repository; earlyoom is Ubuntu's package (its package version).
  docker:
    version: 29.6.2
    where: [spark]
    pin: null
    deployed: false
    docs: https://docs.docker.com/engine/
    context7: null
    changelog: https://docs.docker.com/engine/release-notes/
    advisories: https://github.com/moby/moby/security/advisories
  earlyoom:
    version: 1.7-2
    where: [spark]
    pin: null
    deployed: false
    docs: https://github.com/rfjakob/earlyoom
    context7: null
    changelog: https://launchpad.net/ubuntu/+source/earlyoom/+changelog
    advisories: https://ubuntu.com/security/cves?package=earlyoom
  llama-swap:
    version: v257
    where: [spark]
    pin: sha256:8fb15ff81108064eaedf95af58212be9d7f43775841e1099387dfa823e5ca2b1
    deployed: true
    docs: https://github.com/mostlygeek/llama-swap
    context7: null
    changelog: https://github.com/mostlygeek/llama-swap/releases
    advisories: null
  llama.cpp:
    version: b11146
    where: [spark]
    pin: sha256:4e00496ab6cdee9c00afb11de3cb9d10f9da7e17147d8ed14ca3af05209b400f
    deployed: true
    docs: https://github.com/ggml-org/llama.cpp/tree/master/tools/server
    context7: /ggml-org/llama.cpp
    changelog: https://github.com/ggml-org/llama.cpp/releases
    advisories: https://github.com/ggml-org/llama.cpp/security/advisories
  whisper.cpp:
    version: v1.9.4
    where: [spark]
    pin: git:927cfce34f31707e17f2bff35c349632fb9e2c3a
    deployed: true
    docs: https://github.com/ggml-org/whisper.cpp/tree/master/examples/server
    context7: /ggml-org/whisper.cpp
    changelog: https://github.com/ggml-org/whisper.cpp/releases
    advisories: null
  open-webui:
    version: v0.11.4
    image: ghcr.io/open-webui/open-webui
    where: [spark]
    pin: sha256:9591b13f13843c7721c2b8eaf7382846c81b3ffe126526d1888d1fed50c6a33f
    deployed: true
    docs: https://docs.openwebui.com/
    context7: /open-webui/docs
    changelog: https://github.com/open-webui/open-webui/releases
    advisories: https://github.com/open-webui/open-webui/security/advisories
  searxng:
    version: 2026.9.23-3cd69d30e
    image: docker.io/searxng/searxng
    where: [spark]
    pin: sha256:bcfaed4091d59f7ce85670bd701a2d0295872196dc19908a3965a8353b149f83
    deployed: true
    docs: https://docs.searxng.org/
    context7: null
    changelog: https://github.com/searxng/searxng/commits/master
    advisories: https://github.com/searxng/searxng/security/advisories
  pi:
    version: 0.85.1   # 0.86.0–0.87.1 are reported to crash llama-server; stay below them
    # agent's, on the Spark. The Mac's comes from Homebrew, unpinned (Dan's decision, 2026-09-28).
    where: [spark]
    pin: null
    deployed: false
    docs: https://www.npmjs.com/package/@earendil-works/pi-coding-agent
    context7: null
    changelog: https://www.npmjs.com/package/@earendil-works/pi-coding-agent?activeTab=versions
    advisories: null
