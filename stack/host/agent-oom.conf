# Installed by stack/host/bootstrap.sh as /etc/systemd/system/user@<agent's uid>.service.d/local-ai-oom.conf — edit
# it there, not here.
#
# agent's user manager, and everything it starts (its own services, systemd-run --user, a scope tmux moves into),
# gets the OOM score that sshd's hook gives agent's logins. The value is AGENT_OOM_SCORE_ADJ in
# stack/host/local-ai-agent-oom, which has the arithmetic, and a test keeps the two the same (Phase 2a, Task 28).
# PID 1 sets it as root before it starts the manager, so the floor (oom_score_adj_min) comes with it, and nothing
# under the manager can go below it. This replaces the 100 that systemd 255's user@.service sets.
[Service]
OOMScoreAdjust=1000
