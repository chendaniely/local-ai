[project]
name = "spark"
version = "0.1.0"
description = "Control tool for the brightroar model-serving stack"
requires-python = ">=3.12"
dependencies = ["pyyaml>=6.0.2", "huggingface_hub>=2.1.1,<3"]

[project.scripts]
spark = "spark.cli:main"

[dependency-groups]
dev = ["pytest>=8.4"]

[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spark"]

[tool.uv]
required-version = ">=0.12.18"
# uv's own Pythons only, never the system's, so every machine runs the same interpreter build.
python-preference = "only-managed"
# A release gets locked only once it is seven days old, a rolling window (Dan's decision,
# 2026-09-27): a bad or compromised upload is most often caught in its first days, and the pull
# runs these packages as `spark`, with network access. .github/dependabot.yml waits as long.
exclude-newer = "7 days"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
