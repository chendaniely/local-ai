# prices.yaml: US dollars per million tokens, or per audio minute where a line has per_minute. Claude's tiers checked
# against Anthropic's pricing page and release notes 2026-11-12; the other proxies as their comment below says.
# A line applies from 00:00 UTC on its `from` day, until the next line of its tier. `above`, where a line has one,
# holds the rates for a prompt over `over` tokens.
v: 1
tiers:
  opus:
    - {from: 2026-09-22, name: Opus 5.5, input: 4, output: 20, cache_read: 0.20, write_5m: 5, write_1h: 8}
  sonnet:
    - {from: 2026-09-28, name: Sonnet 5.5, input: 2, output: 10, cache_read: 0.20, write_5m: 2.50, write_1h: 4}
    - {from: 2026-10-07, name: Sonnet 5.5, input: 2, output: 10, cache_read: 0.10, write_5m: 2.50, write_1h: 4}
  haiku:
    - {from: 2026-09-28, name: Haiku 4.5, input: 1, output: 5, cache_read: 0.10, write_5m: 1.25, write_1h: 2}
    - {from: 2026-10-07, name: Haiku 5.5, input: 0.10, output: 0.50, cache_read: 0.01, write_5m: 0.125, write_1h: 0.20,
       above: {over: 100000, input: 0.50, output: 2.50, cache_read: 0.05, write_5m: 0.625, write_1h: 1}}
  fable:
    - {from: 2026-09-01, name: Fable 5.1, input: 10, output: 50, cache_read: 0.25, write_5m: 12.50, write_1h: 20}
    - {from: 2026-11-09, name: Fable 5.2, input: 8, output: 40, cache_read: 0.20, write_5m: 10, write_1h: 16}
# Proxies from other vendors (read 2026-11-12 from developers.openai.com/api/docs/pricing and
# docs.voyageai.com/docs/pricing). A line is per token (the five rates) or per audio minute (`per_minute`, alone).
  whisper-1:
    - {from: 2026-09-01, name: OpenAI whisper-1, per_minute: 0.006}
  gpt-4o-mini-transcribe:
    - {from: 2026-09-01, name: OpenAI gpt-4o-mini-transcribe, input: 1.25, output: 5.00, cache_read: 1.25,
       write_5m: 0, write_1h: 0}
  voyage-4-lite:
    - {from: 2026-09-01, name: Voyage voyage-4-lite, input: 0.02, output: 0, cache_read: 0.02, write_5m: 0,
       write_1h: 0}
