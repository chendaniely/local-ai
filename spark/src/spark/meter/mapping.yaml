# Which Claude tier each model of the registry is priced at, and how the meter treats it (the design's part 1).
# A model with no line here is unpriced and flagged; `none` is unpriced on purpose.
v: 1
tiers:               # per tier: charge uncached prompt tokens at the 5-minute cache-write rate (§3's switch)
  opus: {uncached_as_writes: false}
  sonnet: {uncached_as_writes: false}
  haiku: {uncached_as_writes: false}
  fable: {uncached_as_writes: false}
models:              # tier: opus | sonnet | haiku | fable | none; factor: optional, default 1
  # The chat models by size (Dan's decision, 2026-11-12, website/design/usage-meter-qa.md): the coder, the fast coder
  # and Flash-Next as Sonnet, Qwen3.6 and Gemma (3-4B active) as Haiku. Until then every chat model was Opus.
  # website/reference/model-prices.md shows this file and prices.yaml as a table; a test keeps it the same.
  gemma-4-26b-a4b: {tier: haiku}
  qwen3.8-27b: {tier: sonnet}
  qwen3.6-35b-a3b: {tier: haiku}
  qwen3.8-27b-sglang: {tier: sonnet}
  qwen3.8-flash-next: {tier: sonnet}
  qwen3.8-flash-next-mtp: {tier: sonnet}
  qwen3-embedding-0.6b: {tier: none}
  whisper-large-v3-turbo: {tier: none}
  whisper-large-v3: {tier: none}
  qwen3-asr-1.7b-32k: {tier: none}
  qwen3-asr-1.7b-64k: {tier: none}
  qwen3-asr-0.6b-32k: {tier: none}
  qwen3-asr-0.6b-64k: {tier: none}
