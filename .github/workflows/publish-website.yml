name: publish-website
# Publishes the site on every push to main, and by hand from the Actions tab (Dan's decision,
# 2026-10-14; until then it was manual only, since publishing is outward-facing, and main is public
# already). One at a time: a push while a publish runs waits for it. One-time setup, done
# 2026-10-13: an empty orphan gh-pages branch, and Settings → Pages deploying from it.
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: publish-website
  cancel-in-progress: false
permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: quarto-dev/quarto-actions/setup@8a96df13519ee81fd526f2dfca5962811136661b # v2.2.0
        with:
          version: "1.10.3"
      - uses: quarto-dev/quarto-actions/publish@8a96df13519ee81fd526f2dfca5962811136661b # v2.2.0
        with:
          target: gh-pages
          path: website
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
