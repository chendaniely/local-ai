name: ci
# Runs on every push and PR. On main it also publishes the site (the pages job), and a run by hand
# from the Actions tab on main publishes it too: Dan's decision, 2026-10-14.
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read

# Every job gets a time limit well above its usual run (under a minute), so a hung step fails
# instead of holding a runner for GitHub's default of six hours.
jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.12.18"
      - run: uv run --frozen --project spark pytest spark/tests
      - run: uv run --frozen --project spark spark docs stack --check
      - run: uv run --frozen --project spark spark docs check-scenarios
      - run: uv run --frozen --project spark spark render --out /tmp/rendered

  leaks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.12.18"
      # Three gitleaks steps, so a red one names its cause: a failed download is a network problem,
      # a failed checksum is a tampered or corrupt download, and only the scan reports leaks.
      - name: download gitleaks
        run: curl -fsSL --retry 3 --max-time 120 -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz"
      - name: check gitleaks against its pinned checksum, then unpack it
        run: |
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
      - name: gitleaks over the whole history
        run: ./gitleaks git --redact --no-banner -v --config .githooks/gitleaks.toml .
      - name: repo patterns over every tracked file
        env:
          CI: "true"
        run: uv run --frozen --project spark spark leakcheck --tracked --ci
      # gitleaks' rules don't cover addresses, so the repo's own patterns also read every commit's
      # patches (--cc adds a merge's conflict resolutions) and messages, not only today's tree.
      - name: repo patterns over every commit's patches and messages
        env:
          CI: "true"
        run: |
          git log -p --cc --format='%H%n%B' > "$RUNNER_TEMP/history.txt"
          uv run --frozen --project spark spark leakcheck --message "$RUNNER_TEMP/history.txt" --ci

  shellcheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: shellcheck .githooks/pre-commit .githooks/commit-msg stack/host/bootstrap.sh

  site:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: quarto-dev/quarto-actions/setup@8a96df13519ee81fd526f2dfca5962811136661b # v2.2.0
        with:
          version: "1.10.3"
      - run: quarto render website
      # On main, the rendered site becomes the artifact the pages job deploys.
      - if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: website/_site

  # Publishes the site. Since 2026-10-15 Pages builds from GitHub Actions, not the gh-pages branch
  # (Dan's setting), so there is no branch keeping every rendered version. It runs only on main and
  # only once every other job passed, so nothing reaches the public site past a failed test or leak
  # scan, and it alone gets Pages' permissions. One deploy at a time: a newer one waits.
  pages:
    if: github.ref == 'refs/heads/main'
    needs: [tests, leaks, shellcheck, site]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
